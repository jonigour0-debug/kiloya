
<!DOCTYPE html>
<html>
<head>
<title>KILOYA - Level Select</title>
<style>
body {
  margin: 0;
  background: linear-gradient(135deg,#050b18,#102d50);
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 {
  color: #00eaff;
  font-size: 50px;
  text-shadow: 0 0 20px #00eaff;
}
.container {
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
}
.levels {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}
button {
  padding: 20px;
  background: #007d9c;
  color: white;
  border: 2px solid #00eaff;
  border-radius: 12px;
  font-size: 20px;
  cursor: pointer;
}
button:hover {
  background: #00aaca;
}
.locked {
  background: #333b50;
  border-color: #777;
  color: #bbb;
}
</style>
</head>
<body>

<div class="container">
<h1>KILOYA</h1>
<h2>SELECT YOUR LEVEL</h2>

<div class="levels">
<button onclick="location.href='index.html'">
LEVEL 1
</button>

<button class="locked" onclick="alert('Level 2 Coming Soon!')">LEVEL 2 🔒</button>
<button class="locked" onclick="alert('Level 3 Coming Soon!')">LEVEL 3 🔒</button>
<button class="locked" onclick="alert('Level 4 Coming Soon!')">LEVEL 4 🔒</button>
<button class="locked" onclick="alert('Level 5 Coming Soon!')">LEVEL 5 🔒</button>
<button class="locked" onclick="alert('Level 6 Coming Soon!')">LEVEL 6 🔒</button>
<button class="locked" onclick="alert('Level 7 Coming Soon!')">LEVEL 7 🔒</button>
<button class="locked" onclick="alert('Level 8 Coming Soon!')">LEVEL 8 🔒</button>
<button class="locked" onclick="alert('Level 9 Coming Soon!')">LEVEL 9 🔒</button>
<button class="locked" onclick="alert('Level 10 Coming Soon!')">LEVEL 10 🔒</button>
</div>
</div>
</body>
</html>
